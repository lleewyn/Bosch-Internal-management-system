<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosch Internal Management System</title>
    <!-- Thay đổi favicon để xóa bộ nhớ tạm của trình duyệt -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        /* Fix: đảm bảo không có gì overlay lên form đăng nhập */
        body {
            position: static !important;
        }

        .auth-container {
            position: relative;
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
        }

        .main-footer {
            z-index: 0 !important;
        }

        /* Fix browser autofill overlay */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px white inset !important;
            box-shadow: 0 0 0px 1000px white inset !important;
            -webkit-text-fill-color: #111827 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <img src="Source/Image/Bosch-Logo 1.png" alt="Bosch Logo" class="bosch-logo-img">
                <span class="app-subtitle">Internal Management System</span>
            </div>
            <div class="header-right">
                <i class="fa-solid fa-globe"></i>
                <span>English</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="login-card">
            <div class="card-header">
                <h1>Đăng nhập</h1>
                <p>Truy cập hệ thống quản lý nội bộ</p>
            </div>
            <form class="auth-form" id="loginForm">
                <!-- Thông báo lỗi -->
                <div class="alert-error" id="loginError" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <p id="loginErrorMessage">Tài khoản hoặc mật khẩu không chính xác.</p>
                </div>

                <div class="form-group">
                    <label>Email hoặc tên đăng nhập</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginEmail" placeholder="VD: user@bosch.com" autocomplete="off" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock prefix-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="off"
                            required style="padding-left: 40px;">
                        <i class="fa-regular fa-eye suffix-icon"></i>
                    </div>
                </div>

                <p class="login-note">Lưu ý: Tài khoản sẽ bị khóa nếu nhập sai quá 5 lần</p>

                <div class="form-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Ghi nhớ tài khoản
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
                </div>

                <!-- Nút Đăng nhập bình thường -->
                <button type="submit" class="btn-primary">
                    Đăng nhập <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 8px;"></i>
                </button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="#">IMPRINT</a>
                <a href="#">PRIVACY POLICY</a>
                <a href="#">TERMS OF USE</a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/router.js" defer></script>
    <script src="js/ui-helpers.js" defer></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>

</html>
