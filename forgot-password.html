<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | Bosch HR Management</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css"> <!-- Tái sử dụng một số style form -->
    <link rel="stylesheet" href="css/forgot-password.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="brand-name">BOSCH</span>
                <span class="app-subtitle">Internal Management System</span>
            </div>
            <div class="header-right">
                <i class="fa-solid fa-globe"></i>
                <span>English</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
            </div>
        </div>
    </header>

    <main class="forgot-container">
        <div class="forgot-card">
            <div class="card-header">
                <h1>Yêu cầu cấp lại mật khẩu</h1>
                <p>Nhập email của bạn để nhận liên kết đặt lại mật khẩu hệ thống.</p>
            </div>
            
            <form class="forgot-form">
                <div class="form-group" style="width: 100%;">
                    <label>Email công việc</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="VD: user@bosch.com" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">
                    Gửi yêu cầu <i class="fa-regular fa-paper-plane" style="margin-left: 8px;"></i>
                </button>
            </form>

            <a href="index.html" class="back-to-login">
                <i class="fa-solid fa-arrow-left"></i>
                Quay lại trang đăng nhập
            </a>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="#">IMPRINT</a>
                <a href="#">PRIVACY POLICY</a>
                <a href="#">TERMS OF USE</a>
            </div>
        </div>
    </footer>
</body>
</html>
